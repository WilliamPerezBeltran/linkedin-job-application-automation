[project]
name = "linkedin-job-application-automation"
version = "0.0.1"
description = "Automated workflow for collecting LinkedIn job posts, analyzing opportunities with AI, generating application emails, and selecting the appropriate CV."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.13,<2.0",
    "playwright>=1.45,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.2,<7.0",
    "anthropic>=0.34,<1.0",
    # Gmail API + OAuth 2.0 (Fase 7, ROADMAP.md, ownership gmail-agent):
    # `google-auth`/`google-auth-oauthlib` implementan el flujo OAuth
    # (`InstalledAppFlow`, refresh de token); `google-api-python-client` es
    # el cliente HTTP generado dinámicamente contra la Gmail API
    # (`googleapiclient.discovery.build("gmail", "v1", ...)`), usado
    # exclusivamente para crear drafts (`users.drafts.create`) -- nunca
    # para enviar (`docs/agents/AGENTS.md` sección 12).
    "google-auth>=2.29,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "google-api-python-client>=2.130,<3.0",
    # Scheduler (Fase 9, ROADMAP.md, ownership backend-engineer): un único
    # job diario (`app/presentation/scheduler/jobs.py`) que invoca en
    # secuencia los use cases ya existentes. `BlockingScheduler` + `CronTrigger`
    # bastan -- Celery+Redis solo se consideran si hace falta procesamiento
    # asíncrono pesado (ver CLAUDE.md, "Decisión arquitectónica clave").
    "apscheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<4.0",
    "types-pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# `fastapi.Depends(...)`/`fastapi.Query(...)` en un default de argumento es
# el patrón idiomático de FastAPI para inyección de dependencias (ver
# app/presentation/api/dependencies.py y app/presentation/api/routes/jobs.py,
# Fase 6) -- no la llamada-en-default arbitraria que B008 busca prevenir.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["migrations", "frontend"]

[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `google-api-python-client`/`google-auth-oauthlib` no publican `py.typed`
# (a diferencia de `google-auth`, que sí lo hace) -- sin este override,
# `mypy --strict` reporta "missing library stubs" para
# `app.infrastructure.gmail.gmail_client`/`gmail_draft_repository`.
module = ["googleapiclient.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `apscheduler` (Fase 9, `app/presentation/scheduler/jobs.py`) no publica
# `py.typed` -- mismo tratamiento que `googleapiclient`/`google_auth_oauthlib`
# arriba.
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "unit: fast tests without external I/O",
    "integration: tests that hit a real dependency (e.g. PostgreSQL)",
    "e2e: end-to-end tests across the full pipeline",
]
