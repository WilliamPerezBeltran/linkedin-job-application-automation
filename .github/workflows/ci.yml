# CI (Fase 10, ROADMAP.md — "Tests, Docker y CI/CD"). Ownership:
# `orchestrator` (tooling de repo, sin agente de capa dedicado, ver
# docs/agents/AGENTS.md sección 18).
#
# Cuatro jobs independientes, corridos en paralelo cuando no dependen entre
# sí (`lint`, `test`, `frontend`, `docker-build`) -- ninguno depende de otro
# salvo lo estrictamente necesario, para que un fallo de lint no bloquee ver
# si los tests también fallan, y viceversa.
#
# Nunca corre contra LinkedIn/Gmail/LLM reales -- ver `docs/agents/AGENTS.md`
# sección 16: los tests unitarios ya usan fakes/mocks, y el único servicio
# externo real que este workflow levanta es PostgreSQL (`services: postgres`
# en el job `test`), igual que en desarrollo local
# (`docker-compose.yml`/`.env.example`).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & type-check (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: mypy --strict
        run: mypy app

  test:
    name: Backend tests (unit + integration, real PostgreSQL)
    runs-on: ubuntu-latest
    # PostgreSQL como `services:` de GitHub Actions -- mismo motor/versión
    # que `docker-compose.yml` (`postgres:16-alpine`), expuesto en el
    # runner vía `ports` para que `DATABASE_URL` (`localhost:5432`) lo
    # alcance directamente, sin red Docker Compose de por medio (los
    # `services:` de un job ya corren en la red del propio runner).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: jobs_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d jobs_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/jobs_db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Playwright/Chromium deliberadamente NO se instala en este job:
      # ningún test unitario/de integración lanza un browser real (ver
      # `app/infrastructure/linkedin/browser.py`, el único módulo que
      # importa `playwright.sync_api` -- ninguno de sus consumidores en
      # `tests/**` lo ejercita contra un browser real, todos usan fakes).
      # Instalar el browser acá solo agregaría minutos de CI sin cubrir
      # ningún test real (YAGNI).

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: pytest (unit + integration)
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: linkedin-job-application-automation:ci
          # Cache de capas entre corridas de CI vía la caché de GitHub
          # Actions -- reduce sensiblemente el tiempo de build repetido de
          # la capa de Playwright/Chromium (la más pesada de esta imagen,
          # ver Dockerfile).
          cache-from: type=gha
          cache-to: type=gha,mode=max
